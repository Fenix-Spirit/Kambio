name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      description:
        description: Release description (shown on the GitHub Release)
        type: string
        required: true

concurrency: release

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute and apply next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(grep -oP '^\s*version\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+(?=")' build.gradle.kts | head -n1)
          if [ -z "$CURRENT" ]; then
            echo "::error::No version = \"x.y.z\" line found in build.gradle.kts"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEXT="$MAJOR.$MINOR.$PATCH"
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::Tag v$NEXT already exists"; exit 1
          fi
          sed -i -E "s/^([[:space:]]*version[[:space:]]*=[[:space:]]*)\"$CURRENT\"/\1\"$NEXT\"/" build.gradle.kts
          grep -q "version = \"$NEXT\"" build.gradle.kts
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.next }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit version bump and tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "chore(release): v$NEXT"
          git tag -a "v$NEXT" -m "v$NEXT"
          git push --atomic origin HEAD:main "v$NEXT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          printf '%s\n' "$DESCRIPTION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$NEXT" \
            --title "v$NEXT" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag