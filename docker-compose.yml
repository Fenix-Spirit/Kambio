services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: kambio
      POSTGRES_PASSWORD: kambio
      POSTGRES_DB: kambio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kambio"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/kambio
      DB_USER: kambio
      DB_PASSWORD: kambio
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: